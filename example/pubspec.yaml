name: deep_links_kit_example
description: deep_links_kit with go_router.
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  auto_route: ^11.2.0
  deep_links_kit:
    path: ../
  flutter:
    sdk: flutter
  go_router: ^18.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  auto_route_generator: ^10.6.0
  build_runner: ^2.16.1

deep_links_kit:
  hosts: [app.example.com]
  scheme: myapp
