name: deep_links_kit_example
description: A go_router shop app in Clean Architecture, plus an auto_route app, using deep_links_kit.
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  auto_route: ^11.2.0
  dartz: ^0.10.1
  deep_links_kit:
    path: ../
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  go_router: ^18.1.1
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  auto_route_generator: ^10.6.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true

deep_links_kit:
  hosts: [app.example.com]
  scheme: myapp
