name: deep_links_kit
description: >-
  One config for Android App Links and iOS Universal Links: a CLI that sets up
  the native projects and server files, plus router-agnostic link handling.
version: 0.1.1
repository: https://github.com/wa2lsalem/deep_links_kit
topics:
  - deep-linking
  - app-links
  - universal-links
  - navigation
  - cli

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  app_links: ">=6.4.0 <8.0.0"
  args: ^2.6.0
  flutter:
    sdk: flutter
  yaml: ^3.1.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
